name: Website Scheduled & Dispatch Rebuild

on:
  schedule:
    - cron: '0 6 * * *'
  repository_dispatch:
    types: [npm-published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version

      - name: Build
        working-directory: website
        run: npm ci && npm run build

      # Deploy to Cloudflare Pages via wrangler-action.
      # NOTE: This cron/dispatch deploy path activates only after the operator sets
      # the two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
      # (e.g., via `gh secret set CLOUDFLARE_API_TOKEN` and `gh secret set CLOUDFLARE_ACCOUNT_ID`).
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=flow-website
          workingDirectory: website
