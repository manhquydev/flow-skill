name: CI (npm-wrapper cross-OS tests)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-npm-wrapper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # v0.22 (validation V3): repo is now public, GH Actions minutes are free - this job
  # replaces the parked Azure Pipelines setup as the real cross-OS gate for the bash test
  # suite (skills/flow's own runner + references, not the npm-wrapper). azure-pipelines.yml
  # is demoted to an unused fallback; the operator setup task it was waiting on is closed.
  bash-suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: full
          - os: macos-latest
            shard: full
          - os: windows-latest
            shard: 1/3
          - os: windows-latest
            shard: 2/3
          - os: windows-latest
            shard: 3/3
    runs-on: ${{ matrix.os }}
    # Windows now partitions the current manifest across three isolated runners.
    # Keep its serial-era 80m headroom until real shard timings are available.
    # macOS measured 14m51s suite (TOTAL wall_s=891) plus post-job cleanup, exceeding 15m;
    # macOS gets 25m headroom. Ubuntu (~8m) stays at 15m.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 80 || (matrix.os == 'macos-latest' && 25 || 15) }}
    steps:
      - uses: actions/checkout@v7

      # Pin the interpreter instead of trusting the runner image: the durable layer and
      # the graph executor are python, and 3.7 is the MEASURED floor (subprocess
      # capture_output/text; no walrus, no match, no builtin generics).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Topology lint (shipped flow-topology.json + pin)
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" skills/flow/harness/flow_harness.py graph lint
        shell: bash

      - name: Run flow.sh bash test suite (tests/run_all.sh)
        run: |
          if [ '${{ matrix.shard }}' != full ]; then
            export FLOW_SUITE_SHARD='${{ matrix.shard }}'
          fi
          bash tests/run_all.sh
        shell: bash

      - name: Run PowerShell installer suite (Windows only)
        if: matrix.os == 'windows-latest' && matrix.shard == '1/3'
        run: |
          if (-not (Test-Path tests/test_install_safe_update.ps1)) {
            throw "Mandatory test suite tests/test_install_safe_update.ps1 is missing!"
          }
          pwsh -NoProfile -File tests/test_install_safe_update.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

  # The engine must still gate a project when the durable layer is unavailable. This job
  # is the executable proof of that promise (README/system-architecture both claim it),
  # and it is what a future python-mandatory release would have to consciously replace.
  no-python-degradation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: flow.sh gates a project with NO python on PATH
        run: |
          set -e
          R="$GITHUB_WORKSPACE/skills/flow/runner/flow.sh"
          SB="$(mktemp -d)"; SHIM="$(mktemp -d)"
          # Real absence, not just the opt-out flag: FLOW_HARNESS_DISABLE returns before
          # _python() is ever called, so it exercises none of the interpreter probes.
          for t in bash sh env cat cp mv rm mkdir sed awk grep date tr head tail sort ls dirname basename find printf uname wc cut comm mktemp touch git timeout; do
            p="$(command -v "$t" 2>/dev/null)" && ln -sf "$p" "$SHIM/$t" || true
          done
          run() { ( cd "$SB" && env -i PATH="$SHIM" HOME="$SB" bash "$R" "$@" ); }
          run next
          test -f "$SB/flow/00-idea.md" || { echo "FAIL: stage 00 not scaffolded"; exit 1; }
          # Advance past 00 so the durable hook WOULD fire — otherwise the db assertion is
          # vacuous (stage 00 never mints one even with the harness fully available).
          sed -i 's/- \[ \]/- [x]/g' "$SB/flow/00-idea.md"
          # No heredoc: inside a YAML block scalar the terminator would carry the block
          # indent and never match column 0, so the shell would swallow the rest of the job.
          python3 -c 'import pathlib,re,sys; f=pathlib.Path(sys.argv[1],"flow","00-idea.md"); f.write_text(re.sub(r"\[FILL.*?\]","filled",f.read_text(),flags=re.S))' "$SB"
          run next
          test -f "$SB/flow/01-research.md" || { echo "FAIL: gate did not advance without python"; exit 1; }
          test ! -f "$SB/.flow/harness.db" || { echo "FAIL: db minted with no interpreter"; exit 1; }
          run status >/dev/null
          out="$(run doctor 2>&1 || true)"
          printf '%s' "$out" | grep -qi "python" || { echo "FAIL: doctor hides the missing interpreter"; exit 1; }
          echo "OK: engine scaffolds+gates+diagnoses with no python on PATH"
        shell: bash

  test:
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is our floor (npm OIDC requirement). Node 24 is current LTS.
        # We intentionally do NOT test Node 20 — it reached EOL April 2026.
        node: ['22', '24']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: npm-wrapper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # No registry-url / no OIDC scope — this is a pure test workflow.

      - name: Print environment
        run: |
          node --version
          npm --version
          echo "OS: $RUNNER_OS"
        shell: bash

      - name: Install (no lifecycle scripts for security)
        run: npm ci --ignore-scripts

      - name: Sync skill content from repo root
        run: npm run sync
        env:
          # Fallback: honor the env even if the default resolves to the same path.
          FLOW_SKILL_SRC: ${{ github.workspace }}/skills/flow

      - name: Run node:test suite
        run: npm test

      - name: Guard — no child_process import in src or bin
        # F1 fix: run from repo root with the full pathspec. The previous version had
        # `working-directory: workspace` + `-- 'src/' 'bin/'`, which matched no files in this
        # monorepo (the code is under `npm-wrapper/`), so `git grep` returned nothing and the
        # guard silently no-op'd.
        run: |
          if git grep -nE "from ['\"]node:child_process['\"]|require\(['\"]node:child_process['\"]|require\(['\"]child_process['\"]" -- 'npm-wrapper/src/' 'npm-wrapper/bin/' ; then
            echo "FAIL: node:child_process import detected in npm-wrapper/src/ or npm-wrapper/bin/" >&2
            exit 1
          fi
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Verify tarball packages under 1.5 MB unpacked
        run: |
          npm pack --dry-run --ignore-scripts --json > pack.json
          node -e "const p=require('./pack.json');const s=p[0].unpackedSize;if(s>1572864){console.error('unpacked > 1.5MB: '+s);process.exit(1)}else{console.log('unpacked '+s+' bytes')}"
        shell: bash

  # Credentialless pack → tarball --compare → install → e2e on the INSTALLED runner.
  # Ubuntu only (Windows budget). Local entry point: bash scripts/pack-rehearsal.sh
  pack-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # Same floor as npm-wrapper/package.json engines (>=22.14).
          node-version: '22.14'
      - name: Assert credentialless
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "FAIL: NPM_TOKEN is set; pack-rehearsal is credentialless" >&2
            exit 1
          fi
        shell: bash
      - name: Pack, compare, install, drive
        run: bash scripts/pack-rehearsal.sh
        shell: bash

  # Keyless artifact replay. Skips-with-notice until the operator records a live
  # --record batch (27 judge + 1 probe). Never fabricate those transcripts.
  eval-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Keyless eval --replay (or skip-with-notice)
        run: |
          set -eu
          if command -v claude >/dev/null 2>&1; then
            echo "FAIL: claude is on PATH; replay job must be keyless" >&2
            exit 1
          fi
          if [ ! -f skills/flow/eval/replay/meta ]; then
            echo "NOTICE: no operator-recorded replay fixtures (skills/flow/eval/replay/meta)."
            echo "OPERATOR CHECKPOINT: run live 'flow.sh eval --record --n 3' (27+1 billable) on a host with timeout/gtimeout, commit the stripped tree, then this job asserts replay-ran."
            echo "SKIP_REPLAY_JOB"
            exit 0
          fi
          SB="$(mktemp -d)"
          n="$(awk -F= '$1=="n"{gsub(/\r/,"",$2); print $2; exit}' skills/flow/eval/replay/meta)"
          case "$n" in
            ''|*[!0-9]*) echo "FAIL: replay meta missing a usable n=" >&2; exit 1 ;;
          esac
          out="$(FLOW_PROJECT_ROOT="$SB" FLOW_LOG_DISABLE=1 bash skills/flow/runner/flow.sh eval --replay --n "$n" 2>&1)" || rc=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'SKIP:' && { echo "FAIL: replay inherited live SKIP" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q 'replay:' || { echo "FAIL: no replay-ran sentinel" >&2; exit 1; }
          exit "${rc:-0}"
        shell: bash

  # Phase 2 initial set + Phase 3 pack-rehearsal + Phase 7 keyless replay.
  all-checks-passed:
    needs: [bash-suite, no-python-degradation, test, pack-rehearsal, eval-replay]
    # bash-suite is the whole matrix: any failed/cancelled shard blocks this verdict.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verdict
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          for r in $results; do [ "$r" = "success" ] || { echo "non-success: $results"; exit 1; }; done
