run-name: Publisher ${{ inputs.expected_sha }} ${{ inputs.expected_version }} ${{ inputs.dispatch_id }}
name: Publish npm-wrapper to npm (policy-gated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run checks or release.sh-authorized publish
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
      expected_sha:
        description: Exact master SHA approved by release.sh
        required: true
        type: string
      expected_version:
        description: npm-wrapper version selected by release.sh
        required: true
        type: string
      dispatch_id:
        description: Unique release.sh dispatch correlation ID
        required: true
        type: string
      expected_actor_id:
        description: Authenticated actor ID observed by release.sh
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions: {}

jobs:
  eligibility:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      version: ${{ steps.gate.outputs.version }}
      channel: ${{ steps.gate.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate request and release eligibility
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          WORKFLOW_REF: ${{ github.ref }}
          ACTOR_ID: ${{ github.actor_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          FLOW_AUTOPUBLISH_ENABLED: ${{ vars.FLOW_AUTOPUBLISH_ENABLED }}
          EXPECTED_ACTOR_ID: ${{ inputs.expected_actor_id }}
        run: node scripts/release-workflow.mjs eligibility

  publish:
    needs: eligibility
    if: inputs.mode == 'publish' && vars.FLOW_AUTOPUBLISH_ENABLED == 'true' && needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install npm with OIDC support
        run: npm install --global npm@11.21.0
      - name: Test and pack the exact package once
        working-directory: npm-wrapper
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          npm ci --ignore-scripts
          npm test
          npm pack --pack-destination "$RUNNER_TEMP"
          node ../scripts/release-workflow.mjs record-artifact "$RUNNER_TEMP" "$EXPECTED_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.tgz
            ${{ runner.temp }}/release-artifact.json
          if-no-files-found: error
          retention-days: 90
      - name: Recheck master, CI, intent and registry immediately before publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          FLOW_AUTOPUBLISH_ENABLED: ${{ vars.FLOW_AUTOPUBLISH_ENABLED }}
          ARTIFACT_DIR: ${{ runner.temp }}
          ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_ACTOR_ID: ${{ inputs.expected_actor_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: node scripts/release-workflow.mjs prepublish
      - name: Publish the exact packed archive with provenance
        env:
          DIST_TAG: ${{ needs.eligibility.outputs.channel }}
        run: npm publish "$RUNNER_TEMP"/*.tgz --provenance --access public --tag "$DIST_TAG"
      - name: Audit target-only npm signatures and export verified SLSA bundle
        env:
          VERSION: ${{ needs.eligibility.outputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_REF: refs/heads/master
          AUDIT_REPORT: ${{ runner.temp }}/npm-audit-verified.json
        run: node scripts/npm-attestation-audit.mjs "$VERSION" "$RUNNER_TEMP/release-artifact.json" "$EXPECTED_SHA" "$RUNNER_TEMP/slsa-bundle.json" "$SOURCE_REF" "$AUDIT_REPORT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-audit-verified.json
            ${{ runner.temp }}/slsa-bundle.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify Sigstore trust root, Rekor inclusion, source and digest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.eligibility.outputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/verify-attestation-with-gh.mjs "$RUNNER_TEMP/manhquy-flow-skill-$VERSION.tgz" "$RUNNER_TEMP/slsa-bundle.json" manhquydev flow-skill .github/workflows/publish-npm-wrapper.yml refs/heads/master "$EXPECTED_SHA"
      - name: Verify registry integrity and installed package
        env:
          VERSION: ${{ needs.eligibility.outputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          AUDIT_REPORT: ${{ runner.temp }}/npm-audit-verified.json
        run: node scripts/release-workflow.mjs verify "$VERSION" "$EXPECTED_SHA" "$RUNNER_TEMP/release-artifact.json" "$AUDIT_REPORT" && node npm-wrapper/scripts/smoke.mjs "$VERSION"
